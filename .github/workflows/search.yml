name: typescript @ Search

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: services/search/package-lock.json

      - run: make install

      - name: Format and inspect manifest recovery files
        run: |
          npm run format:fix
          cat src/application/processCrawlCompleted.ts
          cat test/application/processCrawlCompleted.test.ts

      - run: make check

      - run: make test-infra-up

      - run: make test

      - name: Stop integration infrastructure
        if: always()
        run: make test-infra-down
