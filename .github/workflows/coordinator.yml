name: go @ Coordinator

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/coordinator

    env:
      SEARCH_DYNAMODB_ENDPOINT_URL: http://localhost:8000
      SEARCH_RABBITMQ_URL: amqp://castellani:castellani@localhost:5672/

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2

        ports:
          - 8000:8000

        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:4.1-management

        env:
          RABBITMQ_DEFAULT_USER: castellani
          RABBITMQ_DEFAULT_PASS: castellani

        ports:
          - 5672:5672

        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-verify
        with:
          module: services/coordinator
