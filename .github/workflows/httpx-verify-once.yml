name: Shared HTTP one-time verification
on:
  push:
    branches: [feat/coordinator-service]
    paths: [.github/workflows/httpx-verify-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Resolve modules and verify independently
        shell: bash
        run: |
          set +e
          : > /tmp/httpx-verification.txt
          overall=0
          for module in libs/httpx services/gateway services/coordinator; do
            echo "=== $module ===" >> /tmp/httpx-verification.txt
            (
              cd "$module"
              GOWORK=off go mod tidy &&
              gofmt -w $(find . -type f -name '*.go') &&
              test -z "$(gofmt -l $(find . -type f -name '*.go'))" &&
              GOWORK=off go vet ./... &&
              GOWORK=off go test -race ./...
            ) >> /tmp/httpx-verification.txt 2>&1
            code=$?
            echo "result=$code" >> /tmp/httpx-verification.txt
            if [ "$code" -ne 0 ]; then overall=1; fi
          done
          if [ "$overall" -eq 0 ]; then
            docker build -f services/gateway/Dockerfile -t castellani-gateway:httpx . >> /tmp/httpx-verification.txt 2>&1
            code=$?
            echo "gateway_docker_result=$code" >> /tmp/httpx-verification.txt
            if [ "$code" -ne 0 ]; then overall=1; fi
          fi
          echo "overall_result=$overall" >> /tmp/httpx-verification.txt
          cp /tmp/httpx-verification.txt HTTPX-VERIFICATION-TEMP.txt
          git add libs/httpx services/gateway services/coordinator HTTPX-VERIFICATION-TEMP.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(httpx): resolve modules and record verification'
          git push origin HEAD:feat/coordinator-service
