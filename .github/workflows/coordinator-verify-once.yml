name: Coordinator one-time verification
on:
  push:
    branches: [feat/coordinator-service]
    paths: [.github/workflows/coordinator-verify-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Format, resolve dependencies, and verify
        shell: bash
        run: |
          cd services/coordinator
          gofmt -w $(find . -type f -name '*.go')
          go mod tidy > /tmp/coordinator-tidy.log 2>&1
          tidy_status=$?
          if [ "$tidy_status" -eq 0 ]; then
            make check > /tmp/coordinator-check.log 2>&1
            check_status=$?
          else
            check_status=99
          fi
          {
            echo "tidy_status=$tidy_status"
            echo "check_status=$check_status"
            echo "--- go mod tidy ---"
            cat /tmp/coordinator-tidy.log
            echo "--- make check ---"
            if [ -f /tmp/coordinator-check.log ]; then cat /tmp/coordinator-check.log; fi
          } > VERIFICATION-TEMP.txt
          cd ../..
          git add services/coordinator
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(coordinator): verify rewrite and resolve module dependencies'
          git push origin HEAD:feat/coordinator-service
