name: python @ Capture

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04

    env:
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      RABBITMQ_URL: amqp://castellani:castellani@localhost:5672/

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2

        ports:
          - 8000:8000

        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:4.1-management

        env:
          RABBITMQ_DEFAULT_USER: castellani
          RABBITMQ_DEFAULT_PASS: castellani

        ports:
          - 5672:5672

        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: services/capture/.python-version

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/capture/uv.lock

      - run: sudo apt-get update && sudo apt-get install --yes libnss3-tools

      - run: make install
        working-directory: services/capture

      - run: uv run playwright install --with-deps chromium
        working-directory: services/capture

      - run: make check
        working-directory: services/capture

      - run: make test
        working-directory: services/capture
