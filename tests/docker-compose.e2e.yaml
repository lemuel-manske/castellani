services:
  fixture-site:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/fixtures/site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 2s
      timeout: 2s
      retries: 15

  capture-worker:
    environment:
      CAPTURE_ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      fixture-site:
        condition: service_healthy
