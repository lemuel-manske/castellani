services:
  ministack:
    image: ministackorg/ministack:1.5.42
    ports:
      - "4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      PERSIST_STATE: "0"
      S3_PERSIST: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    ports:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: castellani
      RABBITMQ_DEFAULT_PASS: local-development-only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.10.0
    ports:
      - "9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  provision:
    image: hashicorp/terraform:1.16.5
    working_dir: /workspace
    environment:
      TF_VAR_ministack_endpoint: http://ministack:4566
      TF_VAR_aws_region: us-east-1
    volumes:
      - ../infra/terraform:/workspace
    depends_on:
      ministack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["terraform init -input=false -lockfile=readonly && terraform apply -auto-approve -input=false"]
    restart: "no"

  coordinator:
    build:
      context: ..
      dockerfile: services/coordinator/Dockerfile
    ports:
      - "8081"
    environment:
      COORDINATOR_ADDR: ":8081"
      COORDINATOR_AWS_REGION: us-east-1
      COORDINATOR_DYNAMODB_ENDPOINT: http://ministack:4566
      COORDINATOR_RABBITMQ_URL: amqp://castellani:local-development-only@rabbitmq:5672/
      COORDINATOR_RABBITMQ_EXCHANGE: castellani.events
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  capture:
    build:
      context: ../services/capture
      dockerfile: Dockerfile
      args:
        INSTALL_BROWSER: "0"
    ports:
      - "8000"
    environment:
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT_URL: http://ministack:4566
      S3_ENDPOINT_URL: http://ministack:4566
      RABBITMQ_URL: amqp://castellani:local-development-only@rabbitmq:5672/
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      CAPTURE_BROWSER_SLOT_COUNT: "1"
    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  search:
    build:
      context: ..
      dockerfile: tests/images/search/Dockerfile
    ports:
      - "8082"
    environment:
      SEARCH_AWS_REGION: us-east-1
      SEARCH_AWS_ACCESS_KEY_ID: test
      SEARCH_AWS_SECRET_ACCESS_KEY: test
      SEARCH_HTTP_HOST: 0.0.0.0
      SEARCH_HTTP_PORT: "8082"
      SEARCH_DYNAMODB_ENDPOINT_URL: http://ministack:4566
      SEARCH_S3_ENDPOINT_URL: http://ministack:4566
      SEARCH_RABBITMQ_URL: amqp://castellani:local-development-only@rabbitmq:5672/
      SEARCH_OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080"
    environment:
      GATEWAY_ADDR: ":8080"
      COORDINATOR_URL: http://coordinator:8081
      CAPTURE_URL: http://capture:8000
      SEARCH_URL: http://search:8082
      GATEWAY_UPSTREAM_TIMEOUT: 5s
      GATEWAY_STREAM_TIMEOUT: 30m
      GATEWAY_SHUTDOWN_TIMEOUT: 10s
    depends_on:
      coordinator:
        condition: service_healthy
      capture:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
