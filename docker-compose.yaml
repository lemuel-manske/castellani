services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

    environment:
      GATEWAY_ADDR: ":8080"
      COORDINATOR_URL: "${COORDINATOR_URL}"
      CAPTURE_URL: "${CAPTURE_URL}"
      SEARCH_URL: "${SEARCH_URL}"
      GATEWAY_UPSTREAM_TIMEOUT: "${GATEWAY_UPSTREAM_TIMEOUT:-5s}"
      GATEWAY_STREAM_TIMEOUT: "${GATEWAY_STREAM_TIMEOUT:-30m}"
      GATEWAY_SHUTDOWN_TIMEOUT: "${GATEWAY_SHUTDOWN_TIMEOUT:-10s}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    init: true
    read_only: true

    stop_grace_period: 15s

    restart: unless-stopped

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true
