services:
  ministack:
    image: ministackorg/ministack:1.5.42

    ports:
      - "127.0.0.1:${MINISTACK_PORT}:4566"

    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION}
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack
      S3_PERSIST: "1"
      S3_DATA_DIR: /var/lib/ministack/s3

      MINISTACK_OPENSEARCH_ENDPOINT: opensearch:9200

    volumes:
      - ministack-state:/var/lib/ministack
      - ministack-s3:/var/lib/ministack/s3
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.15.0

    ports:
      - "127.0.0.1:${OPENSEARCH_PORT}:9200"

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Castellani-local-1!
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  provision:
    image: hashicorp/terraform:1.16.5
    working_dir: /workspace
    user: "${TERRAFORM_UID:-1000}:${TERRAFORM_GID:-1000}"

    environment:
      TF_VAR_ministack_endpoint: http://ministack:4566
      TF_VAR_aws_region: ${AWS_REGION}

    volumes:
      - ${TERRAFORM_DIR:-./infra/terraform}:/workspace

    depends_on:
      ministack:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-c"]
    command: ["terraform init -input=false -lockfile=readonly && terraform apply -auto-approve -input=false"]
    restart: "no"

  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile

    ports:
      - "127.0.0.1:${COORDINATOR_PORT}:8081"

    environment:
      COORDINATOR_PORT: "8081"

      COORDINATOR_AWS_REGION: ${AWS_REGION}

      COORDINATOR_DYNAMODB_ENDPOINT: http://ministack:4566
      COORDINATOR_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

      COORDINATOR_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      COORDINATOR_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    init: true
    read_only: true
    stop_grace_period: 15s
    restart: unless-stopped

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

  capture:
    build:
      context: ./services/capture
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:${CAPTURE_PORT}:8000"

    environment:
      CAPTURE_PORT: "8000"

      CAPTURE_AWS_REGION: ${AWS_REGION:-us-east-1}

      CAPTURE_DYNAMODB_ENDPOINT_URL: http://ministack:4566
      CAPTURE_S3_ENDPOINT_URL: http://ministack:4566
      CAPTURE_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

      CAPTURE_BROWSER_SLOT_COUNT: ${CAPTURE_BROWSER_SLOT_COUNT:-10}

      CAPTURE_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      CAPTURE_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    shm_size: "1gb"

    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  search:
    build:
      context: ./services/search
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:${SEARCH_PORT:-8082}:8082"

    environment:
      SEARCH_HTTP_PORT: "8082"

      SEARCH_AWS_REGION: ${AWS_REGION}

      SEARCH_DYNAMODB_ENDPOINT_URL: http://ministack:4566
      SEARCH_OPENSEARCH_URL: http://opensearch:9200
      SEARCH_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      SEARCH_S3_ENDPOINT_URL: http://ministack:4566

      SEARCH_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      SEARCH_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    depends_on:
      provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    init: true
    read_only: true
    stop_grace_period: 15s
    restart: unless-stopped

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8080"

    environment:
      GATEWAY_PORT: "8080"

      GATEWAY_COORDINATOR_URL: ${COORDINATOR_URL}
      GATEWAY_CAPTURE_URL: ${CAPTURE_URL}
      GATEWAY_SEARCH_URL: ${SEARCH_URL}

      GATEWAY_UPSTREAM_TIMEOUT: ${GATEWAY_UPSTREAM_TIMEOUT:-5s}
      GATEWAY_STREAM_TIMEOUT: ${GATEWAY_STREAM_TIMEOUT:-30m}
      GATEWAY_SHUTDOWN_TIMEOUT: ${GATEWAY_SHUTDOWN_TIMEOUT:-10s}

    depends_on:
      coordinator:
        condition: service_healthy
      capture:
        condition: service_healthy
      search:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    init: true
    read_only: true
    stop_grace_period: 15s
    restart: unless-stopped

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

volumes:
  ministack-state:
  ministack-s3:
  rabbitmq-data:
