openapi: 3.1.0
info:
  title: Distributed Web Archive API
  version: 1.0.0
  description: Public API contract. Application is single tenant; network-level access control still required. Frontend presentation is unspecified.
servers:
  - url: /
tags:
  - name: Archives
  - name: Search
  - name: Sessions
paths:
  /archives:
    post:
      tags: [Archives]
      operationId: createArchive
      summary: Durably admit an asynchronous archive run
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque caller-supplied key; retained for at least 24 hours.
          schema: {type: string, minLength: 8, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveRequest'}
      responses:
        '202':
          description: Admitted or idempotent replay of prior admission
          headers:
            Location:
              schema: {type: string}
              description: Archive status resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /archives/{archiveId}:
    parameters:
      - $ref: '#/components/parameters/ArchiveId'
    get:
      tags: [Archives]
      operationId: getArchive
      responses:
        '200':
          description: Durable archive state (search progress is independent)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveStatus'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /archives/{archiveId}/pages:
    parameters:
      - $ref: '#/components/parameters/ArchiveId'
    get:
      tags: [Archives]
      operationId: listArchivePages
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page capture outcomes and snapshot metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PageOutcome'}}
                  nextCursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/Problem'}
  /archives/{archiveId}/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/ArchiveId'
      - name: snapshotId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Archives]
      operationId: getSnapshot
      responses:
        '200':
          description: Committed snapshot reference (not the raw captured HTTP body)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '404': {$ref: '#/components/responses/Problem'}
  /archives/{archiveId}/wacz:
    parameters:
      - $ref: '#/components/parameters/ArchiveId'
    get:
      tags: [Archives]
      operationId: getArchiveWacz
      summary: Authorize and stream an immutable published WACZ with range support
      parameters:
        - name: Range
          in: header
          schema: {type: string}
          description: Standard HTTP bytes range; single range supported initially.
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Entire published WACZ
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            ETag: {schema: {type: string}}
          content:
            application/wacz:
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Range: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/wacz:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Problem'}
        '416': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    head:
      tags: [Archives]
      operationId: headArchiveWacz
      summary: Read published WACZ metadata without bytes
      responses:
        '200':
          description: Published WACZ metadata
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Length: {schema: {type: integer, minimum: 0}}
            ETag: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Problem'}
  /search:
    get:
      tags: [Search]
      operationId: searchSnapshots
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
        - name: collectionId
          in: query
          schema: {type: string}
        - name: archiveId
          in: query
          schema: {type: string}
        - name: snapshotId
          in: query
          schema: {type: string}
        - name: capturedFrom
          in: query
          schema: {type: string, format: date-time}
        - name: capturedTo
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching published historical snapshots only
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/SearchResult'}}
                  nextCursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Start short-lived target-site interactive authentication
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
          description: Repeated requests with the same key and body return the same session during the retention period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archiveId, targetUrl]
              properties:
                archiveId: {type: string}
                targetUrl: {type: string, format: uri}
      responses:
        '201':
          description: Session created or replay of the prior session-creation response; browser transport is implementation-defined
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Sessions]
      operationId: getSession
      responses:
        '200':
          description: Session lifecycle status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Sessions]
      operationId: updateSession
      summary: Idempotently transition an interactive session to a terminal desired state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [COMPLETED, CANCELLED]}
      responses:
        '200':
          description: Existing or newly finalized session; repeated completion returns same auth generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  parameters:
    ArchiveId:
      name: archiveId
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
      description: Opaque pagination cursor; never an access token.
  responses:
    Problem:
      description: Standard RFC 9457 problem response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
    ArchiveRequest:
      type: object
      additionalProperties: false
      required: [seedUrl, maxDepth, maxPages]
      properties:
        seedUrl: {type: string, format: uri}
        collectionId: {type: string}
        maxDepth: {type: integer, minimum: 0}
        maxPages: {type: integer, minimum: 1}
        allowedOrigins:
          type: array
          uniqueItems: true
          items: {type: string, format: uri}
          description: Optional additional navigation origins; seed origin permitted by default.
        authGeneration: {type: integer, minimum: 1}
    ArchiveAccepted:
      type: object
      required: [archiveId, status, statusUrl]
      properties:
        archiveId: {type: string}
        status: {const: ACCEPTED}
        statusUrl: {type: string}
    ArchiveStatus:
      type: object
      required: [archiveId, status, capture, replay, search]
      properties:
        archiveId: {type: string}
        status: {type: string, enum: [ACCEPTED, RUNNING, WAITING_FOR_AUTH, FINALIZING, COMPENSATING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]}
        capture:
          type: object
          required: [captured, failed, pending]
          properties:
            captured: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
        replay:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [NOT_READY, PREPARING, READY]}
        search:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [PENDING, INDEXING, READY, DEGRADED]}
            indexed: {type: integer, minimum: 0}
            expected: {type: integer, minimum: 0}
    PageOutcome:
      type: object
      required: [url, status]
      properties:
        url: {type: string}
        status: {type: string, enum: [PENDING, RUNNING, WAITING_FOR_AUTH, CAPTURED, FAILED]}
        snapshotId: {type: string}
        errorCode: {type: string}
        capturedAt: {type: string, format: date-time}
    Snapshot:
      type: object
      required: [archiveId, snapshotId, url, capturedAt]
      properties:
        archiveId: {type: string}
        snapshotId: {type: string}
        url: {type: string}
        finalUrl: {type: string}
        capturedAt: {type: string, format: date-time}
        contentType: {type: string}
    SearchResult:
      type: object
      required: [archiveId, snapshotId, url, capturedAt, snippet]
      properties:
        collectionId: {type: string}
        archiveId: {type: string}
        snapshotId: {type: string}
        url: {type: string}
        capturedAt: {type: string, format: date-time}
        title: {type: string}
        snippet: {type: string, description: Plain text or escaped snippet; never trusted raw HTML.}
        score: {type: number}
    AuthSession:
      type: object
      required: [sessionId, archiveId, status, expiresAt]
      properties:
        sessionId: {type: string}
        archiveId: {type: string}
        status: {type: string, enum: [CREATED, ACTIVE, FINALIZING, COMPLETED, CANCELLED, FAILED, EXPIRED]}
        expiresAt: {type: string, format: date-time}
        authGeneration: {type: integer, minimum: 1}
