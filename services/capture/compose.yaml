services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2

    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

    ports:
      - "8000:8000"

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret

    ports:
      - "9000:9000"
      - "9001:9001"

    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management

    environment:
      RABBITMQ_DEFAULT_USER: castellani
      RABBITMQ_DEFAULT_PASS: castellani

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../../infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../../infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl -q list_queues name | grep -qx 'castellani.capture.start'"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rabbitmq-data:
